name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first: server/client tests and typechecks consume the built @cardpal/shared
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      - name: Smoke test (real server, simulated players)
        run: pnpm smoke-test

  docker:
    name: Docker image builds and runs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cardpal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run the smoke test against the production image itself, exactly as it will be deployed
      - name: Start container
        run: docker run -d --name cardpal -p 3001:3001 -e ADMIN_SECRET=ci-secret cardpal:ci

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Smoke test against the container
        run: pnpm smoke-test
        env:
          SMOKE_TEST_URL: http://localhost:3001
          SMOKE_TEST_ADMIN_SECRET: ci-secret

      - name: Container logs
        if: always()
        run: docker logs cardpal
